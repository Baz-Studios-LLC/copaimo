name: Release

# Build the game for macOS (Apple Silicon) + Windows (x64) and attach the builds
# to the release for the tag, in the studio's launcher convention: asset names
# end in -macos-aarch64.app.tar.gz / -windows-x86_64.zip. The launcher matches
# by SUFFIX, so the version may sit in the middle of the name without breaking
# anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build + attach assets to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-aarch64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Bevy needs ALSA and udev headers on Linux; neither runner here is Linux,
      # so a plain toolchain is the whole neighbourhood.
      - name: Build (release)
        # `--no-default-features` takes the maker's tools out: the terrain brush,
        # the workbench, and the kiln that can spend credits. A player's build
        # should not carry any of them, and the surest way for them not to be there
        # is for them not to be compiled. The step below proves it rather than
        # trusting the flag.
        run: cargo build --release --no-default-features

      # The generation tests are the ones worth having in a release build: they
      # assert the world still has land, still ends in ocean on all four
      # corners, and still finds ground for every city and town.
      - name: Test
        run: cargo test --release

      # Proof rather than trust. A flag can be dropped in an edit nobody reads,
      # and the failure it causes is silent: a release that ships a terrain brush
      # and a kiln looks exactly like one that does not until somebody finds them.
      # The kiln names the service it talks to, so the binary can simply be asked.
      - name: The tools are not in it
        shell: bash
        run: |
          BIN=$(ls target/release/copaimo target/release/copaimo.exe 2>/dev/null | head -1)
          echo "checking $BIN"
          if grep -qa "3daistudio" "$BIN"; then
            echo "::error::the release binary carries the kiln"
            exit 1
          fi
          echo "no kiln in the release binary"

      - name: Compute version (tag without leading v)
        id: ver
        shell: bash
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Package — macOS .app.tar.gz
        if: runner.os == 'macOS'
        run: |
          bash packaging/macos-app.sh target/release/copaimo "${{ steps.ver.outputs.version }}" build
          mkdir -p dist
          # COPYFILE_DISABLE stops macOS tar writing an AppleDouble `._name`
          # sidecar beside every file to carry extended attributes. Nothing
          # reads them here, and without this the shipped bundle carries a
          # litter of them.
          COPYFILE_DISABLE=1 tar -czf "dist/copaimo-macos-aarch64.app.tar.gz" -C build Copaimo.app
          # And a .dmg, which is how a person installs a mac app and how every
          # other studio game ships. The .tar.gz above stays because that is
          # what the launcher matches on; the two are the same app.
          hdiutil create -volname "Copaimo" -srcfolder build/Copaimo.app -ov -format UDZO \
            "dist/copaimo-v${{ steps.ver.outputs.version }}-macos-arm64.dmg"

      # The world lives in assets/ and is READ AT RUNTIME - the map the
      # continents come from, the recipe that turns it into ground, and whatever
      # has been sculpted at Opificium's terrain bench. A build without it opens
      # on an empty sea.
      - name: Package — Windows .zip (binary + assets)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, stage | Out-Null
          Copy-Item target\release\copaimo.exe stage\Copaimo.exe
          Copy-Item -Recurse assets stage\assets
          Compress-Archive -Path stage\* -DestinationPath dist\copaimo-windows-x86_64.zip -Force

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          fail_on_unmatched_files: true
          # The launcher shows the release body as patch notes, and may fetch
          # the release the moment it exists - so the notes must be IN the
          # release from birth.
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
