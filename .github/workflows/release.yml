name: Release

# Build the game for macOS (Apple Silicon) + Windows (x64) and attach the builds
# to the release for the tag, in the studio's launcher convention: asset names
# end in -macos-aarch64.app.tar.gz / -windows-x86_64.zip. The launcher matches
# by SUFFIX, so the version may sit in the middle of the name without breaking
# anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build + attach assets to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-aarch64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Bevy needs ALSA and udev headers on Linux; neither runner here is Linux,
      # so a plain toolchain is the whole neighbourhood.
      - name: Build (release)
        run: cargo build --release

      # The generation tests are the ones worth having in a release build: they
      # assert the world still has land, still ends in ocean on all four
      # corners, and still finds ground for every city and town.
      - name: Test
        run: cargo test --release

      - name: Compute version (tag without leading v)
        id: ver
        shell: bash
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Package — macOS .app.tar.gz
        if: runner.os == 'macOS'
        run: |
          bash packaging/macos-app.sh target/release/ranger-game "${{ steps.ver.outputs.version }}" build
          mkdir -p dist
          # COPYFILE_DISABLE stops macOS tar writing an AppleDouble `._name`
          # sidecar beside every file to carry extended attributes. Nothing
          # reads them here, and without this the shipped bundle carries a
          # litter of them.
          COPYFILE_DISABLE=1 tar -czf "dist/ranger-game-macos-aarch64.app.tar.gz" -C build Ranger.app

      # The world lives in assets/ and is READ AT RUNTIME - the map the
      # continents come from, the recipe that turns it into ground, and whatever
      # has been sculpted at Opificium's terrain bench. A build without it opens
      # on an empty sea.
      - name: Package — Windows .zip (binary + assets)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, stage | Out-Null
          Copy-Item target\release\ranger-game.exe stage\Ranger.exe
          Copy-Item -Recurse assets stage\assets
          Compress-Archive -Path stage\* -DestinationPath dist\ranger-game-windows-x86_64.zip -Force

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          fail_on_unmatched_files: true
          # The launcher shows the release body as patch notes, and may fetch
          # the release the moment it exists - so the notes must be IN the
          # release from birth.
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
