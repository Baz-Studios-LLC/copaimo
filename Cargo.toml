[package]
name = "copaimo"
# Kept in step with the released tag by hand. The workflow takes the version
# from the tag, not from here, so this being stale costs nothing but reads as a
# lie in `cargo` output.
#
# PATCH by default, and mean it. This is a long game and almost nothing that
# happens in a session is a minor version: a release that adds forests, the
# terrain tool and a building reader is still 0.1.x. Save the bigger numbers for
# when the game is a different game.
version = "0.1.21"
edition = "2021"

[features]
# The maker's tools: the terrain brush, the workbench, and the kiln that sends a
# picture away to be made into a model.
#
# ON by default, because a working copy is a development copy and forgetting the
# flag while working is a worse failure than forgetting it while releasing — one
# wastes a minute, the other ships a tool.
#
# Releases are built `--no-default-features`, which takes out the whole of it: the
# menu entries, the states, the systems, and `ureq` with them. A player's build
# should not carry a terrain brush, and it should certainly not carry code that can
# spend somebody's credits.
default = ["tools"]
tools = ["dep:ureq"]

# The executable's own icon, so Explorer, the task bar and a desktop shortcut all
# draw the crest instead of the default. Windows only — it writes a resource
# section, which is a Windows idea.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
# Pinned to 0.16 on purpose: this code is written against 0.16's exact API
# (required components, Msaa-as-component, DistanceFog). Bevy churns its API
# between releases — do NOT bump without updating the code to match.
# Two features beyond the defaults, and both were found the hard way.
#
# `jpeg`: Bevy decodes PNG out of the box and NOT jpeg. The warden's textures are
# jpeg, so the glTF load failed outright and the character simply did not appear —
# no error anywhere near the character, because the failure is in an image.
#
# `bevy_animation`: not a default either, and without it nothing in the game can
# play a clip. This is the real reason a rigged warden slid about instead of
# walking; the keyframes were also wrong, which made it look like a rigging problem
# and cost a while.
bevy = { version = "0.16", features = ["jpeg", "bevy_animation"] }
# Perlin/fBm/ridged-multifractal generators for the terrain heightfield.
noise = "0.9"
# Decodes the source map image on the CPU at startup. We read it directly
# rather than through Bevy's asset server because terrain height has to be
# queryable synchronously (the player spawn point and every chunk mesh need it
# before the first frame), and Bevy's image assets are loaded asynchronously
# and normally live GPU-side only. Version matches the one Bevy 0.16 uses.
image = "0.25"

# For the window's own icon, which Bevy 0.16 has no API of its own for.
#
# **Pinned to the version `bevy_winit` uses.** Two different winit crates in one
# binary compile fine and then refuse to talk: the `Icon` this builds would be a
# different type from the one the window wants, and the error is about a mismatched
# type rather than about a version, which is a confusing hour.
winit = "0.30.13"
# The player's own clock. `SystemTime` is UTC and knows nothing of where they
# are, and the whole point of the day cycle is that nine in the morning here is
# nine in the morning there — so the local offset has to come from somewhere.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Reads the buildings baked at Opificium's builder. The same pair that bench
# writes them with, so the two ends of `assets/buildings/*.json` are parsed by
# the same code even though nothing is shared between the programs.
serde = { version = "1", features = ["derive"] }
# Also reads a GLB's glTF header, so a model can be checked against the game's
# conventions before it reaches a release — see `models.rs`.
serde_json = "1"

# For the kiln: a picture out to a generation service, a model back.
#
# `ureq` rather than anything async, because the firing already runs on its own
# thread and blocking there is simpler than threading a runtime through a game
# with no other use for one.
ureq = { version = "3.4", features = ["json"], optional = true }

# The world generation this game and Opificium's terrain bench BOTH run.
#
# A git dependency and not a path one on purpose: the two repositories are
# separate on GitHub and CI checks out only one, so a path would build on a
# developer's machine and fail every release.
#
# It names no engine, which is what lets a game on Bevy 0.16 and a bench on 0.19
# link the same code. See the crate's own README.
terrain-core = { git = "https://github.com/Baz-Studios-LLC/terrain-core" }

# Bevy's recommended dev profile: optimize dependencies (so the engine and the
# noise crate run at full speed) but keep our own crate quick to recompile.
# The noise sampling in world/terrain.rs is hot enough that an unoptimized
# build would make chunk generation visibly slow.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# What players get. Thin LTO and one codegen unit buy a few percent of CPU frame
# time — the cascade cost is largely submission work inside bevy_render, which
# cross-crate inlining helps — for nothing but a slower release build, and a
# release is built once per tag.
[profile.release]
lto = "thin"
codegen-units = 1

